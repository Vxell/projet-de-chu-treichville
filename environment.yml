# =============================================================================
#  Environnement conda du projet — CHU de Treichville
# =============================================================================
#  Recréation :  conda env create -f environment.yml
#  Mise à jour :  conda env update -f environment.yml --prune
# =============================================================================

name: chu-data-eng

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # --- Traitement des données ------------------------------------------------
  - pandas>=2.2
  - numpy>=1.26

  # --- Base de données -------------------------------------------------------
  - sqlalchemy>=2.0
  - psycopg2                  # driver PostgreSQL (Supabase)
  - python-dotenv>=1.0        # chargement des secrets depuis .env

  # --- Visualisation ---------------------------------------------------------
  - matplotlib>=3.9

  # --- Analyses locales ------------------------------------------------------
  - python-duckdb>=1.1        # moteur SQL de secours pour l'exécution du notebook

  # --- Notebook --------------------------------------------------------------
  - jupyter
  - ipykernel
