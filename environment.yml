# =============================================================================
#  Environnement conda du projet — CHU de Treichville
# =============================================================================
#  Recréation :  conda env create -f environment.yml
#  Mise à jour :  conda env update -f environment.yml --prune
#
#  Ce fichier est complété au fur et à mesure de l'avancement du pipeline.
#  Il ne liste que les paquets explicitement demandés, sans les dépendances
#  transitives ni les versions spécifiques à un système d'exploitation :
#  l'environnement reste ainsi recréable sur Windows, macOS et Linux.
# =============================================================================

name: chu-data-eng

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11

  # --- Traitement des données ------------------------------------------------
  - pandas>=2.2
  - numpy>=1.26

  # --- Notebook --------------------------------------------------------------
  - jupyter
  - ipykernel